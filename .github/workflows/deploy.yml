name: Deploy

on:
  push:
    branches: [master]

env:
  APP: polaris-wayfinder
  APP_URL: https://polaris-wayfinder.fly.dev

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate (lint, format, typecheck, unit tests)
        run: |
          bun run lint
          bun run format:check
          bun run typecheck
          bun run test

      - name: Open maintenance window (stop machines)
        run: |
          started=$(flyctl machines list --json --app "$APP" | jq -r '.[] | select(.state == "started") | .id')
          if [ -z "$started" ]; then
            echo "no started machines to stop; window already closed"
          else
            for id in $started; do
              flyctl machine stop "$id" --app "$APP"
            done
          fi

      - name: Run migrations
        run: bun --cwd apps/server db:migrate

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Verify deployment
        timeout-minutes: 5
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -m 10 "$APP_URL/health" | grep -q '"ok":true'; then
              echo "health check passed"
              break
            fi
            sleep 2
          done
          curl -fsS -m 10 "$APP_URL/health" | grep -q '"ok":true'
          status_code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$APP_URL/api/blueshifts")
          test "$status_code" -eq 401

      - name: Stop machines on failure (door stays closed)
        if: failure() || cancelled()
        run: |
          started=$(flyctl machines list --json --app "$APP" | jq -r '.[] | select(.state == "started") | .id')
          if [ -z "$started" ]; then
            echo "no started machines; door already closed"
          else
            for id in $started; do
              flyctl machine stop "$id" --app "$APP"
            done
          fi
